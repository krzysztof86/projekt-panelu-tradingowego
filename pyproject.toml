[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "market-intelligence-desktop"
version = "0.0.2"
description = "Windows desktop application for detecting anomalies on USDT linear perpetual contracts (Bybit V5, Binance USDⓈ-M). Phase 0: core data contracts only."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "mypy==2.4.0",
    "ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_intelligence = ["py.typed"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # simplify
    "C4",  # comprehensions
    "DTZ", # naive datetime usage
    "PT",  # pytest style
    "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
